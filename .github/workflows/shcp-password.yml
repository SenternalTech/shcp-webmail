# SPDX-License-Identifier: MIT
# shcp_password's TLS options for the panel call (tests/shcp-password/tls.sh):
# a configured anchor is verified, any other certificate is refused, a set but
# unusable setting fails closed, and unset keeps the historical call.
name: shcp-password tls

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tls:
    runs-on: ubuntu-latest
    name: shcp_password TLS options
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: openssl
          coverage: none

      - name: Check the pinned panel call
        run: bash tests/shcp-password/tls.sh
