# SPDX-License-Identifier: MIT
# No AI attribution in this repository's history: a PR's own commits may not
# carry a Co-Authored-By/Session trailer or an AI author identity, and its
# description may not carry a "Generated with" footer (a squash merge copies
# both into main). Only the PR's own commits are checked. Refs shcp-master#3330.
name: attribution

on:
  pull_request:
    branches: [main]
    # The description changes without a push, and a re-run replays the original
    # payload, so `edited` is what lets a fixed description clear the check.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    runs-on: ubuntu-latest
    name: no AI attribution
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The gate's own fixtures
        run: bash .github/attribution/test.sh

      # The body reaches the script through env, never through ${{ }} in the
      # script text, so a crafted description cannot inject shell.
      - name: Scan this PR's commits and description
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/attribution/scan.sh
